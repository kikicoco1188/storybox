<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1b66">
<meta name="description" content="Turn family photos, special occasions, holidays, and everyday adventures into personalized storybooks narrated by the people your child loves most.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>StoryBox – Because Childhood Happens Only Once</title>
<style>
:root{--ink:#fff8e6;--gold:#ffd54f;--deep:#2d1b69}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  background:radial-gradient(ellipse at 50% 20%,#6a45c2 0%,#3d2488 45%,#241459 100%) fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none}
#sky i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.8;animation:tw var(--d) ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15;transform:scale(.7)}to{opacity:.95;transform:scale(1.2)}}
main{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;max-width:760px;margin:0 auto}
.logo{width:132px;height:132px;border-radius:30px;box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 60px rgba(255,213,79,.25);margin-bottom:24px;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{margin:0;font-size:clamp(46px,11vw,84px);line-height:1;letter-spacing:.01em;color:var(--gold);text-shadow:0 4px 24px rgba(0,0,0,.35)}
.tag{margin:16px 0 0;font-size:clamp(20px,4.6vw,30px);font-style:italic}
.lead{margin:36px 0 0;font-size:clamp(20px,4vw,26px);font-weight:700}
p.body{margin:14px 0 0;font-size:clamp(17px,3.4vw,21px);line-height:1.6;max-width:36em;opacity:.95}
.cta{display:inline-block;margin-top:40px;padding:20px 38px;border-radius:999px;background:linear-gradient(180deg,#ffe082,#ffc107);color:var(--deep);
  font:700 clamp(19px,4.2vw,24px) system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none;box-shadow:0 6px 0 #b8860b,0 14px 30px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b,0 6px 14px rgba(0,0,0,.35)}
.cta:focus-visible{outline:4px solid #fff;outline-offset:4px}
@media (prefers-reduced-motion:reduce){#sky i,.logo{animation:none}}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<main>
  <img class="logo" src="icon-512.png" alt="StoryBox open storybook with stars">
  <h1>StoryBox</h1>
  <p class="tag">Because Childhood Happens Only Once.</p>
  <p class="lead">Capture the moments that matter.</p>
  <p class="body">Turn family photos, special occasions, holidays, and everyday adventures into personalized storybooks narrated by the people your child loves most.</p>
  <a class="cta" href="app.html">Create a Storybook Today</a>
</main>
<script>
const sky=document.getElementById('sky');
for(let n=0;n<48;n++){const s=document.createElement('i'),z=1+Math.random()*3;
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--s:${z}px;--d:${2+Math.random()*4}s;animation-delay:${-Math.random()*4}s`;sky.appendChild(s)}
</script>
</body>
</html>
